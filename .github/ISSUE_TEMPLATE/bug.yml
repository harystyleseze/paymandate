name: Bug report
description: Something behaves incorrectly
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened vs. what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Exact steps/commands. For contract issues include the test or transaction; for SDK issues a code snippet.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, rust/node version, stellar-cli version, network (testnet?)"
  - type: markdown
    attributes:
      value: |
        **Security issues:** do NOT open a public issue for vulnerabilities that could affect funds. Contact the maintainers privately (see README).
